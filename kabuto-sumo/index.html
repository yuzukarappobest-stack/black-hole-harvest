<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17221a" />
  <title>カブトムシ相撲</title>
  <link rel="stylesheet" href="./style.css?v=2" />
</head>
<body>
  <main class="app" aria-label="カブトムシ相撲">
    <section class="title-area">
      <p class="eyebrow">BEETLE SUMO</p>
      <h1>カブトムシ相撲</h1>
      <p class="lead">連打して、相手を土俵の外へ押し出せ！</p>
    </section>

    <section class="difficulty-panel" aria-label="相手の強さ">
      <span class="difficulty-label">相手の強さ</span>
      <div class="difficulty-buttons" id="difficultyButtons">
        <button type="button" class="difficulty-button is-active" data-difficulty="normal">ふつう</button>
        <button type="button" class="difficulty-button" data-difficulty="strong">つよい</button>
        <button type="button" class="difficulty-button" data-difficulty="ultra">ちょうつよい</button>
      </div>
    </section>

    <section class="hud" aria-live="polite">
      <div class="score player-score">
        <span>あなた</span>
        <strong id="playerPower">0</strong>
      </div>
      <div id="status" class="status">スタートを押してね</div>
      <div class="score cpu-score">
        <span>CPU</span>
        <strong id="cpuPower">0</strong>
      </div>
    </section>

    <section class="arena-wrap">
      <div class="forest forest-left"></div>
      <div class="arena" id="arena">
        <div class="edge edge-left"></div>
        <div class="edge edge-right"></div>
        <div class="ring-line"></div>

        <div id="beetlePair" class="beetle-pair" aria-hidden="true">
          <div class="beetle beetle-player">
            <svg class="beetle-svg" viewBox="0 0 140 220">
              <defs>
                <linearGradient id="pShell" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#8b5b2b"/>
                  <stop offset="35%" stop-color="#3c2817"/>
                  <stop offset="75%" stop-color="#17100b"/>
                  <stop offset="100%" stop-color="#080605"/>
                </linearGradient>
                <linearGradient id="pThorax" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#72502a"/>
                  <stop offset="50%" stop-color="#26190f"/>
                  <stop offset="100%" stop-color="#090706"/>
                </linearGradient>
                <radialGradient id="pGlow" cx="32%" cy="28%" r="70%">
                  <stop offset="0%" stop-color="#ffd99a" stop-opacity=".55"/>
                  <stop offset="40%" stop-color="#cc8d42" stop-opacity=".16"/>
                  <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <g class="legs" fill="none" stroke="#0a0705" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M45 91 17 69 8 48"/>
                <path d="M40 118 10 119 2 106"/>
                <path d="M46 146 18 169 10 190"/>
                <path d="M95 91 123 69 132 48"/>
                <path d="M100 118 130 119 138 106"/>
                <path d="M94 146 122 169 130 190"/>
              </g>
              <g class="horns" fill="none" stroke="#120c08" stroke-linecap="round" stroke-linejoin="round">
                <path d="M70 55 C70 39 70 22 70 8" stroke-width="12"/>
                <path d="M70 10 47 2" stroke-width="9"/>
                <path d="M70 10 93 2" stroke-width="9"/>
                <path d="M58 50 48 30" stroke-width="7"/>
                <path d="M82 50 92 30" stroke-width="7"/>
              </g>
              <ellipse cx="70" cy="67" rx="29" ry="25" fill="url(#pThorax)" stroke="#080605" stroke-width="4"/>
              <ellipse cx="70" cy="102" rx="40" ry="31" fill="url(#pThorax)" stroke="#080605" stroke-width="4"/>
              <path d="M70 118 C41 116 25 137 25 165 C25 197 44 215 70 215 C96 215 115 197 115 165 C115 137 99 116 70 118Z" fill="url(#pShell)" stroke="#080605" stroke-width="4"/>
              <path d="M70 122 70 211" stroke="#0c0907" stroke-width="4" opacity=".9"/>
              <path d="M38 155 C43 134 53 127 64 124" fill="none" stroke="#b98244" stroke-width="4" opacity=".24" stroke-linecap="round"/>
              <ellipse cx="57" cy="155" rx="23" ry="48" fill="url(#pGlow)"/>
              <circle cx="55" cy="65" r="4" fill="#050403"/>
              <circle cx="85" cy="65" r="4" fill="#050403"/>
            </svg>
          </div>

          <div class="impact" id="impact">⚡</div>

          <div class="beetle beetle-cpu">
            <svg class="beetle-svg" viewBox="0 0 140 220">
              <defs>
                <linearGradient id="cShell" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#76502a"/>
                  <stop offset="35%" stop-color="#342217"/>
                  <stop offset="75%" stop-color="#15100c"/>
                  <stop offset="100%" stop-color="#070605"/>
                </linearGradient>
                <linearGradient id="cThorax" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#624322"/>
                  <stop offset="50%" stop-color="#24180f"/>
                  <stop offset="100%" stop-color="#090706"/>
                </linearGradient>
                <radialGradient id="cGlow" cx="32%" cy="28%" r="70%">
                  <stop offset="0%" stop-color="#ffd99a" stop-opacity=".45"/>
                  <stop offset="40%" stop-color="#b97839" stop-opacity=".14"/>
                  <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <g class="legs" fill="none" stroke="#0a0705" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M45 91 17 69 8 48"/>
                <path d="M40 118 10 119 2 106"/>
                <path d="M46 146 18 169 10 190"/>
                <path d="M95 91 123 69 132 48"/>
                <path d="M100 118 130 119 138 106"/>
                <path d="M94 146 122 169 130 190"/>
              </g>
              <g class="horns" fill="none" stroke="#120c08" stroke-linecap="round" stroke-linejoin="round">
                <path d="M70 55 C70 39 70 22 70 8" stroke-width="12"/>
                <path d="M70 10 47 2" stroke-width="9"/>
                <path d="M70 10 93 2" stroke-width="9"/>
                <path d="M58 50 48 30" stroke-width="7"/>
                <path d="M82 50 92 30" stroke-width="7"/>
              </g>
              <ellipse cx="70" cy="67" rx="29" ry="25" fill="url(#cThorax)" stroke="#080605" stroke-width="4"/>
              <ellipse cx="70" cy="102" rx="40" ry="31" fill="url(#cThorax)" stroke="#080605" stroke-width="4"/>
              <path d="M70 118 C41 116 25 137 25 165 C25 197 44 215 70 215 C96 215 115 197 115 165 C115 137 99 116 70 118Z" fill="url(#cShell)" stroke="#080605" stroke-width="4"/>
              <path d="M70 122 70 211" stroke="#0c0907" stroke-width="4" opacity=".9"/>
              <path d="M38 155 C43 134 53 127 64 124" fill="none" stroke="#a97945" stroke-width="4" opacity=".22" stroke-linecap="round"/>
              <ellipse cx="57" cy="155" rx="23" ry="48" fill="url(#cGlow)"/>
              <circle cx="55" cy="65" r="4" fill="#050403"/>
              <circle cx="85" cy="65" r="4" fill="#050403"/>
            </svg>
          </div>
        </div>

        <div class="center-mark">勝負</div>
      </div>
      <div class="forest forest-right"></div>
    </section>

    <section class="controls">
      <button id="startButton" class="start-button" type="button">勝負開始！</button>
      <button id="tapButton" class="tap-button" type="button" disabled>
        <span class="tap-main">連打！</span>
        <span class="tap-sub">TAP! TAP! TAP!</span>
      </button>
      <p class="hint">スマホ：大きなボタンを連打　／　PC：スペースキーでもOK</p>
    </section>
  </main>

  <script src="./game.js?v=2"></script>
</body>
</html>
