name: Mushijingi AI Self-Play

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mushijingi-reward/ai-training/**'
      - 'mushijingi-reward/cards.js'
      - '.github/workflows/mushijingi-ai-selfplay.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run self-play training
        run: node mushijingi-reward/ai-training/train.js
      - name: Commit learned policy
        run: |
          if git diff --quiet -- mushijingi-reward/ai-policy.js; then
            echo "Policy unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mushijingi-reward/ai-policy.js
          git commit -m "Update Mushijingi AI policy from self-play"
          git push
