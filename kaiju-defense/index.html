<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#162d33">
  <title>怪獣防衛線 | KAIJU DEFENSE</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main id="game">
    <div id="hud" hidden>
      <header><div class="time"><span>TIME</span><b id="time">00:00.0</b></div><div class="district">BAY DISTRICT <small>湾岸防衛線</small></div><button id="pause" class="icon" aria-label="一時停止">Ⅱ</button></header>
      <section class="boss"><div><span>巨獣 ヴォルガ</span><b id="healthText">100%</b></div><div class="healthTrack"><i id="health"></i></div></section>
      <div id="warning" role="status"></div>
      <div id="crosshair"><i></i><b></b></div>
      <div id="hit" aria-hidden="true">×</div>
      <div id="status">AUTO FIRE</div>
      <div class="stats"><span>街区破壊 <b id="destroyed">0</b></span><span>転倒 <b id="knockdowns">0</b></span></div>
      <div id="joystick" aria-label="移動スティック"><div id="stick"></div></div>
    </div>
    <section id="intro" class="overlay intro">
      <div class="introContent"><p class="eyebrow">OPERATION 01 / BAY DISTRICT</p><h1>怪獣防衛線</h1><p class="english">KAIJU DEFENSE</p><p class="brief">街を揺らす巨獣を、撃ち倒せ。</p><div class="instructions"><p><b>左スティック</b>で移動 · <b>右ドラッグ</b>で照準</p><p>銃は自動連射。攻撃を受けても復帰できる。</p><small>PC: WASDで移動 / ドラッグで照準</small></div><button id="start" class="primary" disabled>準備中…</button><p id="loadStatus" role="status">都市を読み込んでいます</p></div>
    </section>
    <section id="pauseScreen" class="overlay" hidden><div class="result"><p class="eyebrow">PAUSED</p><h2>一時停止</h2><button id="resume" class="primary">戦闘に戻る</button></div></section>
    <section id="finish" class="overlay" hidden><div class="result"><p class="eyebrow">MISSION COMPLETE</p><h2>巨獣、撃破。</h2><p class="record" id="resultTime"></p><p id="best"></p><div class="resultStats" id="resultStats"></div><a id="returnLink" class="primary" href="../learn.html" style="text-decoration:none">がくしゅうへ</a></div></section>
    <button id="sound" class="sound" aria-label="音の切り替え" aria-pressed="true">音 ON</button>
  </main>
  <script type="module" src="main.js?v=3"></script>
</body>
</html>
