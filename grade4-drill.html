<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7fbff">
    <title>小4算数｜ドリル</title>
    <link rel="stylesheet" href="math.css?v=8">
    <link rel="stylesheet" href="grade4-drill.css?v=1">
  </head>
  <body>
    <main class="math-app">
      <section class="work-panel">
        <header class="topbar">
          <a href="learn.html" aria-label="学習メニューにもどる">←</a>
          <span class="lesson-name">小4算数</span>
          <div><span>せいかい </span><strong id="correctCount">0</strong><span>/5</span></div>
        </header>

        <section id="problemCard" class="problem-card" aria-live="polite">
          <div class="problem-heading">
            <p class="section-title">がい数の計算（1）</p>
            <span id="problemNumber" class="problem-number">1 / 10</span>
          </div>
          <p class="instruction">それぞれの数を四捨五入して、上から1けたのがい数にしてから計算しよう。</p>
          <div id="problemText" class="problem-text">238 ＋ 660</div>
        </section>

        <section id="answerArea" class="answer-area">
          <p class="section-title">こたえ（だいたいの数）</p>
          <div id="answerDisplay" class="answer-display" aria-live="polite">数字を入力</div>
          <div class="keyboard" aria-label="数字のキーボード">
            <button class="key" data-digit="1" type="button">1</button>
            <button class="key" data-digit="2" type="button">2</button>
            <button class="key" data-digit="3" type="button">3</button>
            <button class="key" data-digit="4" type="button">4</button>
            <button class="key" data-digit="5" type="button">5</button>
            <button class="key" data-digit="6" type="button">6</button>
            <button class="key" data-digit="7" type="button">7</button>
            <button class="key" data-digit="8" type="button">8</button>
            <button class="key" data-digit="9" type="button">9</button>
            <button class="key" data-digit="0" type="button">0</button>
            <button id="backspaceButton" class="key utility" type="button">⌫</button>
            <button id="clearAnswerButton" class="key utility" type="button">C</button>
          </div>
          <button id="submitButton" class="submit-button" type="button">こたえる</button>
          <p id="feedback" class="feedback" aria-live="polite"> </p>
        </section>

        <section id="finishedPanel" class="finished-panel hidden" aria-live="polite">
          <h1>10もん ぜんぶクリア！ 🎉</h1>
          <p>おためしドリルは ここまで。つぎの問題を おたのしみに！</p>
          <button id="restartButton" class="submit-button" type="button">はじめから やりなおす</button>
          <small>※これまでの進みぐあいをリセットします</small>
        </section>
      </section>

      <section class="scratch-panel">
        <div class="scratch-header">
          <p class="section-title">フリー入力らん</p>
          <button id="clearScratchButton" class="clear-scratch" type="button">消す</button>
        </div>
        <canvas id="scratchCanvas" aria-label="途中の計算を書く手書き欄"></canvas>
      </section>
    </main>
    <script src="grade4-drill.js?v=1"></script>
  </body>
</html>
