<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, user-scalable=yes" />
  <meta name="theme-color" content="#172117" />
  <title>蟲神器 SOLO - 学習ごほうび</title>
  <link rel="stylesheet" href="./styles.css?v=7" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1>蟲神器 SOLO</h1>
        <p>スターター＋第1〜4弾・CPU対戦</p>
      </div>
      <button id="newGameBtn" class="ghost-btn">がくしゅうへ</button>
    </header>

    <main>
      <section id="startScreen" class="start-screen panel">
        <h2>使うデッキを選んでね</h2>
        <p>スターター2種、または第1〜4弾ランダムデッキでCPUと対戦できます。</p>
        <div class="deck-choices">
          <button class="deck-choice kabuto" data-deck="kabuto">
            <span class="deck-icon">🪲</span>
            <strong>カブトムシデッキ</strong>
            <small>守りながら、すくい投げで道をあける</small>
          </button>
          <button class="deck-choice mantis" data-deck="mantis">
            <span class="deck-icon">🦗</span>
            <strong>オオカマキリデッキ</strong>
            <small>強い攻撃とカマ連撃で押し切る</small>
          </button>
          <button class="deck-choice random1" data-deck="random1">
            <span class="deck-icon">🎴</span>
            <strong>ランダム（第1弾）</strong>
            <small>第1弾ブースター106種から毎回ランダムに20枚</small>
          </button>
          <button class="deck-choice random2" data-deck="random2">
            <span class="deck-icon">🪲</span>
            <strong>ランダム（第2弾）</strong>
            <small>第2弾ブースター55種から毎回ランダムに20枚</small>
          </button>
          <button class="deck-choice random3" data-deck="random3">
            <span class="deck-icon">🕷️</span>
            <strong>ランダム（第3弾）</strong>
            <small>第3弾ブースター60種から毎回ランダムに20枚</small>
          </button>
          <button class="deck-choice random4" data-deck="random4">
            <span class="deck-icon">🦋</span>
            <strong>ランダム（第4弾）</strong>
            <small>第4弾ブースター64種から毎回ランダムに20枚</small>
          </button>
        </div>
        <div class="rules-note">
          <b>この版について</b>
          <span>学習後のごほうびとして1回だけ遊べます。対戦終了後は学習へ戻ります。</span>
        </div>
      </section>

      <section id="gameScreen" class="game-screen hidden">
        <section class="player-zone opponent-zone panel">
          <div class="zone-head">
            <div><b id="cpuDeckName">CPU</b><span class="cpu-badge">CPU</span></div>
            <div class="mini-stats">
              <span>山札 <b id="cpuDeckCount">0</b></span>
              <span>手札 <b id="cpuHandCount">0</b></span>
              <span>捨て札 <b id="cpuDiscardCount">0</b></span>
              <span>エサ <b id="cpuBaitCount">0</b></span>
            </div>
          </div>

          <div class="board-lane hand-lane cpu-hand-lane">
            <div class="lane-title">CPU 手札</div>
            <div class="hidden-hand-row" id="cpuHandVisual"></div>
          </div>

          <div class="resource-lane">
            <div class="pile-zone">
              <div class="lane-title">山札</div>
              <div id="cpuDeckVisual" class="pile-visual"></div>
            </div>
            <div class="board-lane bait-lane">
              <div class="lane-title">エサ場</div>
              <div id="cpuBaitVisual" class="mini-card-row"></div>
            </div>
            <div class="pile-zone">
              <div class="lane-title">捨て札</div>
              <div id="cpuDiscardVisual" class="pile-visual"></div>
            </div>
          </div>

          <div class="board-lane territory-lane">
            <div class="lane-title">縄張り <span>6枚からスタート</span></div>
            <div class="territory-row" id="cpuTerritory"></div>
          </div>

          <div class="board-lane field-lane">
            <div class="lane-title">場 <span id="cpuFieldCount">0体</span></div>
            <div class="field-row" id="cpuField"></div>
          </div>
        </section>

        <section class="battle-center panel">
          <div class="turn-strip">
            <span id="turnLabel">準備中</span>
            <span id="phaseLabel"></span>
            <span id="costLabel"></span>
          </div>
          <div id="messageBox" class="message-box">デッキを準備しています。</div>
          <div id="actionBar" class="action-bar"></div>
          <details class="log-box">
            <summary>対戦ログ</summary>
            <div id="gameLog"></div>
          </details>
        </section>

        <section class="player-zone self-zone panel">
          <div class="board-lane field-lane">
            <div class="lane-title">場 <span id="playerFieldCount">0体</span></div>
            <div class="field-row" id="playerField"></div>
          </div>

          <div class="board-lane territory-lane">
            <div class="lane-title">縄張り <span>6枚からスタート</span></div>
            <div class="territory-row" id="playerTerritory"></div>
          </div>

          <div class="resource-lane">
            <div class="pile-zone">
              <div class="lane-title">山札</div>
              <div id="playerDeckVisual" class="pile-visual"></div>
            </div>
            <div class="board-lane bait-lane">
              <div class="lane-title">エサ場</div>
              <div id="playerBaitVisual" class="mini-card-row"></div>
            </div>
            <div class="pile-zone">
              <div class="lane-title">捨て札</div>
              <div id="playerDiscardVisual" class="pile-visual"></div>
            </div>
          </div>

          <div class="zone-head player-zone-head">
            <div><b id="playerDeckName">あなた</b></div>
            <div class="mini-stats">
              <span>山札 <b id="playerDeckCount">0</b></span>
              <span>捨て札 <b id="playerDiscardCount">0</b></span>
              <span>エサ <b id="playerBaitCount">0</b></span>
            </div>
          </div>

          <div class="board-lane hand-lane player-hand-lane">
            <div class="lane-title">手札 <span id="playerHandCount"></span></div>
            <div class="hand-row" id="playerHand"></div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <div id="resultPopup" class="result-popup hidden" role="dialog" aria-modal="true">
    <div class="result-card">
      <div id="resultTitle" class="result-title"></div>
      <div id="resultText" class="result-text"></div>
      <button id="resultRestartBtn" class="result-restart-btn">がくしゅうへ</button>
    </div>
  </div>

<div id="cpuActionPopup" class="cpu-action-popup hidden" aria-live="polite" aria-atomic="true">
    <div class="cpu-action-card">
      <div class="cpu-action-label">CPUの行動</div>
      <div id="cpuActionText" class="cpu-action-text"></div>
      <div class="cpu-action-progress"></div>
    </div>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3 id="modalTitle">選んでください</h3>
      <p id="modalText"></p>
      <div id="modalOptions" class="modal-options"></div>
    </div>
  </div>

  <script src="./cards.js?v=7"></script>
  <script src="./engine.js?v=7"></script>
  <script src="./app.js?v=7"></script>
</body>
</html>
