<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f7fbff">
    <title>小5 さんすう文章題</title>
    <link rel="stylesheet" href="grade5-word-problems.css?v=1">
  </head>
  <body>
    <main class="word-app">
      <section class="work-panel">
        <header class="topbar">
          <div class="title-lockup"><span>小5 さんすう</span><strong>文章題</strong></div>
          <div><span>せいかい</span><strong id="correctCount">0</strong><span id="goalCount">/100</span></div>
        </header>

        <section class="problem-card" aria-live="polite">
          <div class="problem-heading"><p class="section-title">もんだい</p><span id="categoryLabel" class="category-label">小数のかけ算</span></div>
          <p id="problemText" class="problem-text"></p>
        </section>

        <section class="answer-area">
          <p class="section-title">こたえ</p>
          <div id="answerDisplay" class="answer-display" aria-live="polite">数字を入力</div>
          <div class="keyboard" aria-label="ソフトウェアキーボード">
            <button class="key" data-key="1" type="button">1</button><button class="key" data-key="2" type="button">2</button><button class="key" data-key="3" type="button">3</button><button class="key" data-key="4" type="button">4</button><button class="key" data-key="5" type="button">5</button><button class="key" data-key="6" type="button">6</button><button class="key" data-key="7" type="button">7</button><button class="key" data-key="8" type="button">8</button><button class="key" data-key="9" type="button">9</button><button id="decimalButton" class="key utility" type="button">.</button><button class="key" data-key="0" type="button">0</button><button id="backspaceButton" class="key utility" type="button">⌫</button>
          </div>
          <div class="answer-actions"><button id="clearAnswerButton" class="clear-answer" type="button">C</button><button id="submitButton" class="submit-button" type="button">こたえる</button></div>
          <p id="feedback" class="feedback"> </p>
        </section>
      </section>

      <section class="scratch-panel">
        <div class="scratch-header"><p class="section-title">フリー入力らん</p><button id="clearScratchButton" class="clear-scratch" type="button">消す</button></div>
        <canvas id="scratchCanvas" aria-label="途中式を書く手書き欄"></canvas>
      </section>

      <section id="completePanel" class="complete-panel hidden" aria-live="assertive">
        <div class="complete-box"><p class="complete-mark">100</p><h1>おめでとう！</h1><p>100問 できたね！</p><button id="againButton" class="submit-button" type="button">もういちど</button></div>
      </section>
    </main>
    <script src="grade5-word-problems.js?v=1"></script>
  </body>
</html>
