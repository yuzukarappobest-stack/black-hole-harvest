<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#8fd5ff">
  <title>カートレース</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main id="app">
    <canvas id="raceCanvas" aria-label="周回する3Dカートレース"></canvas>
    <section class="hud" aria-label="レースじょうほう">
      <div class="hud-item highlight"><span>じゅんい</span><strong id="positionValue">6 / 6</strong></div>
      <div class="hud-item"><span>しゅうかい</span><strong id="lapValue">1 / 3</strong></div>
      <div class="hud-item"><span>はやさ</span><strong><em id="speedValue">0</em><small>km/h</small></strong></div>
      <div class="hud-item"><span>じかん</span><strong id="timeValue">0.0</strong></div>
    </section>
    <canvas id="minimap" class="minimap" width="150" height="125" aria-label="コースと車のいち"></canvas>
    <button id="pauseButton" class="pause-button" type="button" aria-label="いちじていし">Ⅱ</button>
    <button id="recenterButton" class="recenter-button hidden" type="button">ハンドル<br>ちょうせい</button>
    <button id="brakeButton" class="brake-button hidden" type="button">ブレーキ</button>
    <div id="banner" class="banner hidden" aria-live="polite">3</div>

    <section id="readyPanel" class="overlay">
      <div class="panel">
        <div class="panel-eyebrow">3D KART RACING</div>
        <h1>カートレース！</h1>
        <div class="kart-icon" aria-hidden="true">🏎️💨</div>
        <p>CPU 5だい と 3しゅう しょうぶ！<br>1いを めざそう！</p>
        <div class="howto">
          <div>📱 スマホを かたむけて まがる</div>
          <div>🚗 まえには じどうで はしる</div>
          <div>🛑 カーブの まえで ブレーキ！</div>
        </div>
        <button id="startButton" class="start-button" type="button">レース スタート！</button>
        <p id="controlHint" class="hint">かたむきが つかえない ときは がめんを ドラッグ<br>PCは ← → と スペースで そうさ</p>
        <small>ベスト：<span id="bestTime">まだないよ</span></small>
      </div>
    </section>

    <section id="pausePanel" class="overlay hidden">
      <div class="panel">
        <h2>いちじていし</h2>
        <p>じゅんびが できたら つづきを はしろう</p>
        <button id="resumeButton" class="start-button" type="button">つづける</button>
      </div>
    </section>
    <section id="resultPanel" class="overlay hidden" aria-live="polite">
      <div class="panel">
        <p class="panel-eyebrow">GOAL!</p>
        <h2 id="resultPlace">1い / 6だい</h2>
        <p class="result-time" id="resultTime">0.0びょう</p>
        <p id="resultMessage">がんばったね！</p>
        <button id="returnButton" class="start-button" type="button">がくしゅうへ もどる</button>
      </div>
    </section>
  </main>
  <script type="module" src="game.js?v=2"></script>
</body>
</html>
