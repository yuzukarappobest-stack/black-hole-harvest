<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060a20">
    <title>スペースブラスター</title>
    <link rel="stylesheet" href="style.css?v=1">
  </head>
  <body>
    <main id="gameRoot">
      <div id="hud" class="hud hidden">
        <div><span>SCORE</span><strong id="scoreValue">0</strong></div>
        <div><span>TIME</span><strong id="timeValue">0.0</strong></div>
        <div id="bossHud" class="boss-hud hidden"><span>GIANT UFO</span><i><b id="bossHealth"></b></i></div>
      </div>
      <div id="notice" class="notice hidden"></div>
      <section id="startScreen" class="screen">
        <div class="panel">
          <p>3D SPACE SHOOTER</p>
          <h1>SPACE<br>BLASTER</h1>
          <div class="ship-icon" aria-hidden="true">▲</div>
          <strong>うちゅうせんを うごかして<br>てきを うちおとそう！</strong>
          <small>ゆびで ドラッグして いどう</small>
          <button id="startButton" type="button">しゅっぱつ！</button>
        </div>
      </section>
      <section id="finishScreen" class="screen hidden" aria-live="assertive">
        <div class="panel">
          <p id="resultKicker">MISSION CLEAR</p>
          <h1 id="resultTitle">CLEAR!</h1>
          <strong id="resultTime">TIME 0.0秒</strong>
          <small id="bestTime">BEST --</small>
          <button id="restartButton" type="button">もういちど</button>
        </div>
      </section>
    </main>
    <script type="module" src="game.js?v=1"></script>
  </body>
</html>
